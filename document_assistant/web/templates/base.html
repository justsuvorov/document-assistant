<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ДМС-ассистент{% endblock %}</title>
  <!-- HTMX. В закрытом контуре без интернета положите htmx.min.js в
       document_assistant/web/static/ и замените src на /static/htmx.min.js -->
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #002033;
      --card: #0d2e45;
      --muted: #8eafc0;
      --white: #ffffff;
      --blue: #1a6fa8;
      --orange: #c47a1e;
      --dim: #4a5560;
      --green: #2e8b57;
      --red: #b3423a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 48px; }
    header.top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
    }
    h1 { font-size: 20px; margin: 0; }
    .card {
      background: var(--card); border-radius: 8px;
      padding: 18px; margin-bottom: 16px;
    }
    .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    a { color: var(--muted); }
    button, .btn {
      background: var(--blue); color: var(--white); border: 0;
      border-radius: 6px; padding: 10px 18px; font-size: 14px;
      cursor: pointer; text-decoration: none; display: inline-block;
    }
    button:disabled { background: var(--dim); cursor: default; }
    .btn-orange { background: var(--orange); }
    input[type=file], input[type=number] {
      width: 100%; padding: 8px; border-radius: 6px;
      border: 1px solid var(--dim); background: var(--bg); color: var(--white);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--bg); }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    td.name { word-break: break-word; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 12px; background: var(--dim);
    }
    .badge.queued { background: var(--dim); }
    .badge.processing { background: var(--orange); }
    .badge.done { background: var(--green); }
    .badge.error { background: var(--red); }
    .bar { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
    .bar > span {
      display: block; height: 100%; background: var(--blue);
      transition: width .4s ease;
    }
    /* Прогресс по чанкам воркер наружу не отдаёт, поэтому во время обработки
       бар бегущий, а не врущий конкретным процентом. */
    .bar.indet > span { width: 35%; animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide {
      0% { margin-left: 0%; }
      50% { margin-left: 65%; }
      100% { margin-left: 0%; }
    }
    .muted { color: var(--muted); font-size: 13px; }
    .err { color: #ffb3ad; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>ДМС-ассистент</h1>
      <div class="muted">
        {% if user %}{{ user.user_name or user.user_id }} · <a href="/auth/logout">Выйти</a>{% endif %}
      </div>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
