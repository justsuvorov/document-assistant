# Общий блок переменных для api и worker: оба гоняют один и тот же доменный
# код и должны видеть одинаковые настройки модели, хранилища и БД.
x-app-env: &app_env
  # Пути
  NORMATIVE_BASE: ${NORMATIVE_BASE:-/app/normative_base}
  EXAMPLES_PATH: ${EXAMPLES_PATH:-/app/examples}
  # Обработка
  LLM_MAX_CHARS: ${LLM_MAX_CHARS:-2200000}
  LLM_MAX_CHUNKS: ${LLM_MAX_CHUNKS:-0}
  LLM_MAX_SECTIONS: ${LLM_MAX_SECTIONS:-300}
  LLM_BATCH_SIZE: ${LLM_BATCH_SIZE:-25}
  AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
  # Qwen (модель)
  QWEN_API_URL: ${QWEN_API_URL}
  QWEN_MODEL_NAME: ${QWEN_MODEL_NAME:-Qwen3.6-35B-A3B-NVFP4}
  QWEN_MAX_TOKENS: ${QWEN_MAX_TOKENS:-100000}
  QWEN_NUM_CTX: ${QWEN_NUM_CTX:-400000}
  # Промты — обязательные, берутся из .env
  AI_ROLE: ${AI_ROLE}
  AI_PROMPT_TEMPLATE: ${AI_PROMPT_TEMPLATE}
  # Хранилище: общий каталог на диске, смонтирован в api и worker
  STORAGE_DIR: ${STORAGE_DIR:-/data}
  # База (она же очередь задач)
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://da:da@postgres:5432/document_assistant}
  # Авторизация
  AUTH_DISABLED: ${AUTH_DISABLED:-false}
  AUTH_DEV_USER_ID: ${AUTH_DEV_USER_ID:-dev-user}
  KEYCLOAK_URL: ${KEYCLOAK_URL:-}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
  SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-session-secret}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

services:

  api:
    build: .
    container_name: document_assistant_api
    restart: always
    depends_on:
      - postgres
    ports:
      - "8001:80"
    volumes:
      # Каталог файлов общий с воркером: api пишет входные файлы и отдаёт
      # результаты, worker читает вход и кладёт отчёты.
      - appdata:/data
      - ./normative_base:/app/normative_base
      - ./examples:/app/examples
    environment:
      <<: *app_env
      # Долгих запросов на api нет — они ушли в worker.
      MAX_WORKERS: 2
      TIMEOUT: 120

  worker:
    build: .
    container_name: document_assistant_worker
    restart: always
    depends_on:
      - postgres
    # Тот же образ, другая точка входа: здесь живёт вся длинная LLM-обработка.
    # Задачи забираются прямо из таблицы sessions, брокер не нужен.
    command: python -m document_assistant.worker
    volumes:
      - appdata:/data
      - ./normative_base:/app/normative_base
      - ./examples:/app/examples
    environment:
      <<: *app_env
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-2}
      WORKER_JOB_TIMEOUT: ${WORKER_JOB_TIMEOUT:-7200}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2}
      WORKER_STALE_TIMEOUT: ${WORKER_STALE_TIMEOUT:-10800}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}

  postgres:
    image: postgres:16-alpine
    container_name: document_assistant_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-da}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-da}
      POSTGRES_DB: ${POSTGRES_DB:-document_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  # Файлы сессий. На сервере обычно заменяется на bind-mount в нужный каталог:
  #   STORAGE_DIR=/srv/document-assistant/data
  appdata:
